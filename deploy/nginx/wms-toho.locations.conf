# Include INSIDE the existing wms.toho.my.id server block.
# Replace existing proxy/static locations for this site; do not duplicate them.
# Keep the site's SSL, redirects, ACME verification, and logging configuration.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:5279;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;

    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Expires;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Next.js filenames are content-hashed; these can be cached for one year.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Retain Next.js optimized-image caching.
location = /_next/image {
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Public images, stylesheets, JavaScript and fonts may use browser caching.
# /api/ takes precedence, including API downloads ending in .xlsx or .csv.
location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot)$ {
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    expires 7d;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Covers dashboard, login, ALL admin pages, query strings and RSC navigation.
location / {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Expires;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
